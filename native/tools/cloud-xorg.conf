Section "ServerLayout"
 Identifier "ThingLingTestLayout"
 Screen 0 "ThingLingTestScreen"
EndSection
Section "Device"
 Identifier "ThingLingDummyDevice"
 Driver "dummy"
 VideoRam 256000
EndSection
Section "Monitor"
 Identifier "ThingLingTestMonitor"
 HorizSync 5.0-1000.0
 VertRefresh 5.0-200.0
 Modeline "1440x900" 106.50 1440 1520 1672 1904 900 903 909 934 -HSync +VSync
EndSection
Section "Screen"
 Identifier "ThingLingTestScreen"
 Device "ThingLingDummyDevice"
 Monitor "ThingLingTestMonitor"
 DefaultDepth 24
